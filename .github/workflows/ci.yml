name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

  # Plan §10: "E2E on main or manual trigger" — not on every PR, since this test waits on a
  # real 2-minute campaign deadline plus a worker poll tick (~2.2 minutes wall-clock).
  e2e:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ready && exit 0
            sleep 2
          done
          echo "API never became ready" && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @marketplace/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @marketplace/web run test:e2e

      - name: Tear down
        if: always()
        run: docker compose down -v
